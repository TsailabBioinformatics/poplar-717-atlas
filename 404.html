<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>717 Gene Hub has moved</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://tsailabbioinformatics.github.io/717-gene-hub/">
<style>
  body { font: 17px/1.5 Georgia, serif; max-width: 34rem; margin: 18vh auto 0; padding: 0 16px; color: #1a1a1a; background: #fffefb; }
  a { color: #8a2c2c; }
</style>
<script>
  // Keep the page the visitor asked for: path, query and #/gene/... all carry over.
  var rest = location.pathname.replace(/^\/poplar-717-atlas\/?/, '');
  location.replace('https://tsailabbioinformatics.github.io/717-gene-hub/' + rest + location.search + location.hash);
</script>
</head>
<body>
<p>The 717 Gene Hub (formerly the Poplar 717 gene atlas) has moved to
<a href="https://tsailabbioinformatics.github.io/717-gene-hub/">tsailabbioinformatics.github.io/717-gene-hub</a>.
If you are not taken there automatically, use that link.</p>
</body>
</html>

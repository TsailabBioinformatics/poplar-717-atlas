name: pages (site files only)

# LIVE since 2026-09-21 (Chen: "merge pages-site-only and turn on the site-only deploy").
# PAGES_SITE_ONLY is true and Settings -> Pages -> Source is "GitHub Actions"; this is the only
# thing that publishes the site now. A push to main publishes nothing by itself.
#
# WHY. GitHub Pages used to publish this repo's ROOT, so everything tracked here was public:
# scripts/, docs/, TODO.md, CHANGELOG.md and every sources/*.tsv.gz table, not just the site.
# That is how the unpublished candidate labels reached the public site before 2026-09-21: they
# were never in the site's data, only in files the site did not need and served anyway.
# This workflow publishes ONLY what the site fetches, measured rather than guessed: every
# request a full walk of the site makes goes to index.html, css/, js/, data/ or
# sources/*.provenance.json (the About page renders those records). LICENSE and CITATION.cff
# ride along for readers.
#
# SAFER IN A SECOND WAY. A completed `checks` run establishes workflow-run eligibility for its
# exact head SHA. This job then assembles a fresh allowlisted artifact, validates it, and runs
# the browser suite against that directory before upload-pages-artifact receives those same bytes.
#
# THE TWO SETTINGS it depends on (both set 2026-09-21, both Chen's to change):
#   1. Settings -> Secrets and variables -> Actions -> Variables: PAGES_SITE_ONLY = true
#   2. Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
# With the variable unset every job below is skipped. To go back to publishing the whole repo:
# set Source to "Deploy from a branch" (main, /root) and the variable to false.
# The allowlist is enforced by scripts/assemble_site.py and checked again by
# scripts/check_site_artifact.py. Add a newly fetched asset type deliberately in both places;
# otherwise it will 404 live while a source-tree-only local check can still pass.

on:
  workflow_run:
    workflows: [checks]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      vars.PAGES_SITE_ONLY == 'true' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      SITE_DIR: _site
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # the exact commit the checks passed on, not whatever main is by now
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify checkout matches release revision
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check version references agree
        run: |
          python3 scripts/check_version.py
          python3 scripts/sync_preload.py --check

      - name: Assemble the public Pages artifact
        run: python3 scripts/assemble_site.py --output "$SITE_DIR"

      - name: Validate the exact public artifact
        run: |
          python3 scripts/validate_data.py \
            --data-dir "$SITE_DIR/data" \
            --source-root "$GITHUB_WORKSPACE" \
            --scan-root "$SITE_DIR"
          python3 scripts/check_site_artifact.py \
            --site "$SITE_DIR" \
            --commit "$RELEASE_SHA" \
            --write-release

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright-core@1.62.1
          npx --yes playwright@1.62.1 install --with-deps chromium

      - name: Browser-test the exact public artifact
        run: |
          set -euo pipefail
          python3 scripts/serve_ranges.py 8931 "$SITE_DIR" &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8931/index.html >/dev/null && break
            sleep 1
          done
          CI_CHROME="$(node -e "console.log(require('playwright-core').chromium.executablePath())")" \
            node scripts/check.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          # The validated artifact includes .nojekyll; this action otherwise drops dotfiles.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
